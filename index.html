<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Boobielicious</title>
<meta name="description" content="En stille amme-tæller.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boobielicious">
<meta name="theme-color" content="#F7F2EC">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F7F2EC;
    --sand: #E7DCCD;
    --sand-deep: #D9CAB6;
    --ink: #3B322B;
    --muted: #8E8174;
    --line: #3B322B;
    --accent: #E27D95;
    --accent-soft: rgba(226, 125, 149, .16);
    --sage: #9AA48C;
    --skin: #F8D3CD;
    --areola: #EE7F98;
    --nipple: #B4475F;
    --night: rgba(217, 202, 182, .28);
    --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }

  .app {
    height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding:
      calc(env(safe-area-inset-top) + 28px)
      calc(env(safe-area-inset-right) + 24px)
      calc(env(safe-area-inset-bottom) + 20px)
      calc(env(safe-area-inset-left) + 24px);
  }

  header { text-align: center; }
  .date {
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .count {
    margin-top: 18px;
    font-family: var(--serif);
    font-weight: 400;
    line-height: 1;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: .28em;
  }
  .count .n {
    font-size: 84px;
    display: inline-block;
    min-width: .6em;
    font-variant-numeric: lining-nums;
  }
  .count .n.bump { animation: bump .7s cubic-bezier(.2,.7,.2,1); }
  .count .of {
    font-size: 26px;
    font-style: italic;
    color: var(--muted);
  }
  @keyframes bump {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: none; }
  }

  /* Dots: 8 small markers under the counter */
  .dots { display: flex; gap: 9px; justify-content: center; margin-top: 16px; height: 6px; }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%;
    border: 1px solid var(--sand-deep);
    transition: background .6s ease, border-color .6s ease;
  }
  .dots i.on { background: var(--accent); border-color: var(--accent); }

  main {
    flex: 1;
    padding-bottom: 56px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .press {
    position: relative;
    width: min(66vw, 264px);
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    transition: transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .press:active { transform: scale(.965); }
  .press svg { width: 100%; height: 100%; overflow: visible; }
  .press .areola { transform-origin: 100px 100px; transform-box: view-box; }
  .press.pulse .areola { animation: soft 1s ease; }
  @keyframes soft {
    0% { transform: scale(1); }
    35% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .press .drop { transform-origin: 100px 132px; transform-box: view-box; }
  .press.pulse .drop { animation: drip 1.3s cubic-bezier(.4,0,.2,1); }
  @keyframes drip {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    45% { transform: translateY(26px) scale(.8); opacity: 0; }
    46% { transform: translateY(-6px) scale(.2); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1.5px solid var(--areola);
    opacity: 0;
    pointer-events: none;
  }
  .press.pulse .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1); }
  .press.pulse .ring + .ring { animation-delay: .18s; }
  @keyframes ring {
    0% { opacity: .5; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.28); }
  }
  /* Tidtagning: tynd ring om brystet + tid nedenunder */
  .press .track {
    position: absolute;
    inset: -14px;
    width: calc(100% + 28px); height: calc(100% + 28px);
    transform: rotate(-90deg);
    pointer-events: none;
    opacity: 0;
    transition: opacity .8s ease;
  }
  .timing .track { opacity: 1; }
  .track circle { fill: none; }
  .track .bg { stroke: var(--sand-deep); stroke-width: .6; }
  .track .fg { stroke: var(--areola); stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 0 1; transition: stroke-dasharray 1s linear; }
  .track .tick { fill: var(--sand-deep); stroke: none; transition: fill .6s ease; }
  .track .tick.done { fill: var(--areola); }
  .timer {
    position: absolute;
    top: calc(100% + 26px); left: -40px; right: -40px;
    text-align: center;
    opacity: 0;
    transition: opacity .6s ease;
    pointer-events: none;
  }
  .timing .timer { opacity: 1; }
  .timer .clock {
    display: block;
    font-family: var(--serif);
    font-size: 34px;
    line-height: 1;
    font-variant-numeric: lining-nums tabular-nums;
  }
  .timer .sub {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .alarm .timer .sub { color: var(--nipple); }
  .alarm .ring { animation: ring 1.6s cubic-bezier(.2,.7,.2,1) infinite !important; }
  .hint {
    position: absolute;
    top: calc(100% + 24px); left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .04em;
    transition: opacity .5s ease;
  }

  footer { width: 100%; max-width: 360px; text-align: center; }

  /* Døgnlinje: 00–24 med en lille bjælke pr. amning (bredde = varighed) */
  .strip {
    position: relative;
    height: 22px;
    border-radius: 4px;
    background: linear-gradient(to right,
      var(--night) 0 25%, transparent 25% 91.667%, var(--night) 91.667% 100%);
  }
  .strip::before {           /* grundlinje */
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: var(--sand-deep); opacity: .7;
  }
  .strip .h {                /* små streger ved 06, 12, 18 */
    position: absolute; top: 50%; width: 1px; height: 7px; margin-top: -3px;
    background: var(--sand-deep);
  }
  .strip .b {
    position: absolute; top: 4px; bottom: 4px;
    min-width: 3px;
    border-radius: 3px;
    background: var(--areola);
    opacity: .9;
  }
  .strip .b.live { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  .strip .now {
    position: absolute; top: 1px; bottom: 1px; width: 1.5px; margin-left: -.75px;
    background: var(--ink); opacity: .35; border-radius: 1px;
  }
  .axis {
    position: relative; height: 12px;
    margin-top: 6px;
    font-size: 10px; color: var(--muted); letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
  }
  .axis span { position: absolute; transform: translateX(-50%); }
  .axis span:first-child { transform: none; }
  .axis span:last-child { transform: translateX(-100%); }
  .strip-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .strip-head b { font-weight: 500; color: var(--ink); letter-spacing: .04em; text-transform: none; font-size: 13px; font-variant-numeric: tabular-nums; }
  .day { display: block; width: 100%; padding: 4px 0; text-align: left; }
  .since {
    margin-top: 14px;
    min-height: 18px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .02em;
    transition: opacity .4s ease;
  }
  .since b { font-weight: 500; color: var(--ink); }
  .timing .since { opacity: 0; }
  .actions { margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 4px; }
  .actions .sep { color: var(--sand-deep); }
  .undo, .link {
    padding: 10px 12px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .04em;
    text-decoration: underline;
    text-decoration-color: var(--sand-deep);
    text-underline-offset: 4px;
    transition: opacity .3s ease;
  }
  .undo:disabled { opacity: .35; pointer-events: none; }

  /* Historik */
  .sheet {
    position: fixed; inset: 0;
    z-index: 20;
    background: var(--bg);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: translateY(100%);
    transition: transform .55s cubic-bezier(.2,.75,.2,1), visibility 0s linear .55s;
    visibility: hidden;
    padding:
      calc(env(safe-area-inset-top) + 24px)
      calc(env(safe-area-inset-right) + 24px)
      calc(env(safe-area-inset-bottom) + 40px)
      calc(env(safe-area-inset-left) + 24px);
  }
  .sheet.open { transform: none; visibility: visible; transition: transform .55s cubic-bezier(.2,.75,.2,1); }
  .sheet-in { max-width: 420px; margin: 0 auto; }
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; }
  .sheet-head h2 { font-family: var(--serif); font-weight: 400; font-size: 40px; line-height: 1; }
  .close { font-size: 13px; color: var(--muted); padding: 8px 0 8px 16px; letter-spacing: .04em; }
  .seg {
    display: inline-flex; margin-top: 22px; padding: 3px;
    background: var(--sand); border-radius: 999px;
  }
  .seg button {
    font-size: 12px; letter-spacing: .03em; color: var(--muted);
    padding: 7px 14px; border-radius: 999px;
    transition: background .3s ease, color .3s ease;
  }
  .seg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(59,50,43,.08); }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 16px; margin: 28px 0 30px; }
  .stats div { border-top: 1px solid var(--sand-deep); padding-top: 12px; }
  .stats b { display: block; font-family: var(--serif); font-weight: 400; font-size: 32px; line-height: 1; font-variant-numeric: lining-nums; }
  .stats b small { font-size: 15px; font-style: italic; color: var(--muted); margin-left: 2px; }
  .stats span { display: block; margin-top: 6px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .grid { --lbl: 54px; --cnt: 52px; }
  .grid .axis { margin: 0 calc(var(--cnt) + 12px) 8px calc(var(--lbl) + 12px); }
  .days { list-style: none; }
  .days li { border-top: 1px solid color-mix(in srgb, var(--sand-deep) 55%, transparent); }
  .row {
    width: 100%;
    display: grid; grid-template-columns: var(--lbl) 1fr var(--cnt); gap: 12px; align-items: center;
    padding: 11px 0; text-align: left;
  }
  .row .lbl { font-size: 12px; color: var(--muted); letter-spacing: .02em; white-space: nowrap; }
  .row .cnt { font-family: var(--serif); font-size: 20px; line-height: 1; text-align: right; font-variant-numeric: lining-nums; }
  .row .cnt small { display: block; margin-top: 3px; font-family: var(--sans); font-size: 10px; color: var(--muted); letter-spacing: .02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .strip { height: 18px; }
  .row .strip .b { top: 3px; bottom: 3px; }
  .days li.today .lbl { color: var(--ink); }
  .detail {
    display: none;
    padding: 0 var(--cnt) 14px calc(var(--lbl) + 12px);
    font-size: 12px; color: var(--muted);
    line-height: 1.9;
    font-variant-numeric: tabular-nums;
  }
  .detail span { white-space: nowrap; margin-right: 14px; }
  .detail span em { font-style: normal; color: var(--ink); margin-right: 4px; }
  .days li.open .detail { display: block; animation: bump .4s ease; }
  .empty-log { margin-top: 40px; text-align: center; color: var(--muted); font-size: 13px; }

  /* Celebration */
  .celebrate {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }
  .celebrate .p {
    position: absolute;
    top: -24px;
    will-change: transform, opacity;
    animation: fall linear forwards;
  }
  .celebrate .leaf { width: 9px; height: 14px; border-radius: 0 100% 0 100%; }
  .celebrate .dot { width: 6px; height: 6px; border-radius: 50%; }
  @keyframes fall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    10% { opacity: .9; }
    85% { opacity: .9; }
    100% { transform: translate3d(var(--drift), 105vh, 0) rotate(var(--spin)); opacity: 0; }
  }
  .message {
    position: fixed;
    left: 0; right: 0;
    top: calc(env(safe-area-inset-top) + 24vh);
    text-align: center;
    padding: 0 32px;
    z-index: 11;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  .message.show { opacity: 1; }
  .message p {
    display: inline-block;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    padding: 18px 26px;
    border-radius: 2px;
  }
  .message .big { display: block; font-family: var(--serif); font-size: 34px; font-style: italic; }
  .message .small { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }

  @media (max-height: 640px) {
    .count .n { font-size: 66px; }
    .press { width: min(52vw, 196px); }
    .timer .clock { font-size: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="date" id="date"></div>
    <div class="count" aria-live="polite"><span class="n" id="n">0</span><span class="of">af 8</span></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </header>

  <main>
    <button class="press" id="press" aria-label="Registrer amning">
      <span class="ring"></span><span class="ring"></span>
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="100" fill="var(--skin)"/>
        <g class="areola">
          <circle cx="100" cy="100" r="22" fill="var(--areola)"/>
          <circle cx="100" cy="100" r="10" fill="var(--nipple)"/>
        </g>
        <path class="drop" d="M100 128 C 103 136, 106 142, 106 147 A 6 6 0 0 1 94 147 C 94 142, 97 136, 100 128 Z" fill="#fff"/>
      </svg>
      <svg class="track" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="bg" cx="110" cy="110" r="108"/>
        <circle class="fg" id="arc" cx="110" cy="110" r="108" pathLength="1"/>
        <g id="ticks"></g>
      </svg>
      <span class="hint" id="hint">Tryk for at starte</span>
      <span class="timer" aria-live="off"><span class="clock" id="clock">0:00</span><span class="sub" id="sub">Tryk igen for at stoppe</span></span>
    </button>
  </main>

  <footer>
    <button class="day" id="dayBtn" aria-label="I dag. Åbn historik">
      <div class="strip-head"><span>I dag</span><b id="total"></b></div>
      <div class="strip" id="strip"></div>
      <div class="axis" aria-hidden="true"><span style="left:0">00</span><span style="left:25%">06</span><span style="left:50%">12</span><span style="left:75%">18</span><span style="left:100%">24</span></div>
    </button>
    <p class="since" id="since"></p>
    <div class="actions">
      <button class="undo" id="undo" disabled>Fortryd seneste</button>
      <span class="sep" aria-hidden="true">·</span>
      <button class="link" id="logBtn">Historik</button>
    </div>
  </footer>
</div>

<section class="sheet" id="sheet" aria-label="Historik" aria-hidden="true">
  <div class="sheet-in">
    <div class="sheet-head"><h2>Historik</h2><button class="close" id="closeLog">Luk</button></div>
    <div class="seg" id="seg" role="tablist">
      <button data-days="7" class="on">7 dage</button><button data-days="14">14 dage</button><button data-days="30">30 dage</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="grid">
      <div class="axis" aria-hidden="true"><span style="left:0">00</span><span style="left:25%">06</span><span style="left:50%">12</span><span style="left:75%">18</span><span style="left:100%">24</span></div>
      <ol class="days" id="days"></ol>
    </div>
  </div>
</section>

<label id="haptic" aria-hidden="true" style="position:fixed;left:-100px;top:0;width:1px;height:1px;overflow:hidden;opacity:0"><input type="checkbox" switch tabindex="-1"></label>
<audio id="player" playsinline preload="auto"></audio>

<div class="celebrate" id="celebrate" aria-hidden="true"></div>
<div class="message" id="message" role="status"><p><span class="big">Otte i dag.</span><span class="small">Du giver så meget. Hvil dig, når du kan.</span></p></div>

<script>
(() => {
  const KEY = 'boobielicious.feeds';
  const CEL = 'boobielicious.celebrated';
  const GOAL = 8;
  const KEEP_DAYS = 60;
  const DUR = 'boobielicious.durations';   // { tidsstempel: sekunder }
  const ACTIVE = 'boobielicious.active';    // { start, fired: [minutter] }
  const MILESTONES = [10, 15, 25];          // minutter
  const FULL = 25;                          // ringen er fuld ved 25 min
  const MAX_SESSION = 3 * 3600e3;           // glemt timer lukkes efter 3 timer

  const $ = id => document.getElementById(id);
  const els = { date: $('date'), n: $('n'), dots: $('dots'), press: $('press'), undo: $('undo'), strip: $('strip'), since: $('since'), total: $('total'), sheet: $('sheet'), days: $('days'), stats: $('stats'), seg: $('seg'), hint: $('hint'), clock: $('clock'), sub: $('sub'), arc: $('arc'), ticks: $('ticks'), cel: $('celebrate'), msg: $('message') };

  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const fmtTime = t => new Date(t).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
  const fmtDate = d => d.toLocaleDateString('da-DK', { weekday: 'long', day: 'numeric', month: 'long' });

  const all = () => store.get(KEY, []).filter(Number.isFinite).sort((a, b) => a - b);
  const today = () => { const m = midnight(); return all().filter(t => t >= m); };

  for (let i = 0; i < GOAL; i++) els.dots.appendChild(document.createElement('i'));

  let currentDay = dayKey();

  function render(opts = {}) {
    const list = today();
    const count = list.length;

    els.date.textContent = fmtDate(new Date());
    if (els.n.textContent !== String(count)) {
      els.n.textContent = count;
      if (opts.animate) { els.n.classList.remove('bump'); void els.n.offsetWidth; els.n.classList.add('bump'); }
    }
    [...els.dots.children].forEach((d, i) => d.classList.toggle('on', i < count));

    drawStrip(els.strip, midnight());
    renderSince();
    if (els.sheet.classList.contains('open')) renderLog();
    els.undo.disabled = count === 0;
    els.hint.style.opacity = count === 0 && !active() ? 1 : 0;
  }

  const durations = () => store.get(DUR, {});

  // ---- Døgnlinje og historik ----
  const dayStartOf = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const nextDay = t => { const d = new Date(t); d.setDate(d.getDate() + 1); return d.getTime(); };
  const durMs = (t, dur, a) => dur[t] ? dur[t] * 1000 : (a && a.start === t ? Date.now() - t : 0);
  const fmtSpan = ms => {
    const m = Math.round(ms / 60000);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h} t ${r} min` : `${h} t`;
  };

  function drawStrip(el, start) {
    const end = nextDay(start), len = end - start, now = Date.now();
    const dur = durations(), a = active();
    let html = [25, 50, 75].map(p => `<i class="h" style="left:${p}%"></i>`).join('');
    all().filter(t => t >= start && t < end).forEach(t => {
      const left = (t - start) / len * 100;
      const w = Math.min(100 - left, durMs(t, dur, a) / len * 100);
      html += `<i class="b${a && a.start === t ? ' live' : ''}" style="left:${left.toFixed(3)}%;width:${w.toFixed(3)}%"></i>`;
    });
    if (now >= start && now < end) html += `<i class="now" style="left:${((now - start) / len * 100).toFixed(3)}%"></i>`;
    el.innerHTML = html;
  }

  // Samlet ammetid for et døgn, inkl. en igangværende amning
  function dayTotal(start) {
    const end = nextDay(start), dur = durations(), a = active();
    return all().filter(t => t >= start && t < end).reduce((sum, t) => sum + durMs(t, dur, a), 0);
  }
  const fmtTotal = ms => {
    const m = Math.floor(ms / 60000);
    if (!m) return ms ? '< 1 min' : '';
    const h = Math.floor(m / 60), r = m % 60;
    return h ? `${h} t ${String(r).padStart(2, '0')} min` : `${m} min`;
  };
  const fmtTotalShort = ms => {
    const m = Math.round(ms / 60000);
    if (!m) return '';
    const h = Math.floor(m / 60), r = m % 60;
    return h ? `${h} t ${String(r).padStart(2, '0')}` : `${m} min`;
  };
  function renderTotal() {
    const ms = dayTotal(midnight());
    els.total.textContent = ms ? fmtTotal(ms) + ' ammet' : '';
  }

  function renderSince() {
    renderTotal();
    const list = all();
    if (!list.length) { els.since.textContent = 'Tryk på brystet, når I begynder'; return; }
    const last = list[list.length - 1], dur = durations()[last];
    const ago = Date.now() - last - (dur ? dur * 1000 : 0);   // regnet fra amningen sluttede
    els.since.innerHTML = ago < 60000
      ? 'Sidst ammet <b>lige nu</b>'
      : `Sidst ammet for <b>${fmtSpan(ago)}</b> siden`;
  }

  let logDays = 7;
  function dayLabel(start) {
    const t = midnight();
    if (start === t) return 'I dag';
    if (start === dayStartOf(t - 1)) return 'I går';
    const d = new Date(start);
    return d.toLocaleDateString('da-DK', { weekday: 'short' }).replace('.', '') + ' ' + d.getDate() + '.';
  }

  function renderLog() {
    const dur = durations(), feeds = all(), a = active();
    const starts = [];
    let s0 = midnight();
    for (let i = 0; i < logDays; i++) { starts.push(s0); s0 = dayStartOf(s0 - 1); }
    const from = starts[starts.length - 1];
    const inRange = feeds.filter(t => t >= from);

    // Nøgletal: hele døgn (i dag tæller kun med, hvis der ikke er andre data)
    const fullDays = starts.slice(1).filter(s => feeds.some(t => t >= s && t < nextDay(s)));
    const perDay = fullDays.length
      ? fullDays.reduce((n, s) => n + feeds.filter(t => t >= s && t < nextDay(s)).length, 0) / fullDays.length
      : feeds.filter(t => t >= midnight()).length;
    const durs = inRange.map(t => dur[t]).filter(Boolean);
    const avgDur = durs.length ? durs.reduce((x, y) => x + y, 0) / durs.length / 60 : 0;
    const gaps = [];
    for (let i = 1; i < inRange.length; i++) {
      const g = inRange[i] - inRange[i - 1] - (dur[inRange[i - 1]] || 0) * 1000;
      if (g > 0 && g < 12 * 3600e3) gaps.push(g);
    }
    const avgGap = gaps.length ? gaps.reduce((x, y) => x + y, 0) / gaps.length : 0;
    const totals = (fullDays.length ? fullDays : [midnight()]).map(dayTotal).filter(Boolean);
    const avgTotal = totals.length ? totals.reduce((x, y) => x + y, 0) / totals.length : 0;
    const totH = Math.floor(avgTotal / 3600e3), totM = Math.round(avgTotal % 3600e3 / 60000);
    const gapH = Math.floor(avgGap / 3600e3), gapM = Math.round(avgGap % 3600e3 / 60000);
    const fmtNum = n => n.toLocaleString('da-DK', { maximumFractionDigits: 1 });
    els.stats.innerHTML =
      `<div><b>${inRange.length ? fmtNum(perDay) : '–'}</b><span>Pr. døgn</span></div>` +
      `<div><b>${avgTotal ? `${totH}<small>t</small> ${totM}<small>m</small>` : '–'}</b><span>Ammetid pr. døgn</span></div>` +
      `<div><b>${avgDur ? Math.round(avgDur) + '<small>min</small>' : '–'}</b><span>Varighed pr. amning</span></div>` +
      `<div><b>${avgGap ? `${gapH}<small>t</small> ${gapM}<small>m</small>` : '–'}</b><span>Mellem amninger</span></div>`;

    const open = new Set([...els.days.querySelectorAll('li.open')].map(li => li.dataset.start));
    els.days.innerHTML = '';
    starts.forEach((start, i) => {
      const list = feeds.filter(t => t >= start && t < nextDay(start));
      const li = document.createElement('li');
      li.dataset.start = start;
      if (i === 0) li.classList.add('today');
      if (open.has(String(start))) li.classList.add('open');
      li.innerHTML = `<button class="row" aria-label="${dayLabel(start)}: ${list.length} amninger, ${fmtTotal(dayTotal(start)) || 'ingen ammetid'}"><span class="lbl">${dayLabel(start)}</span><span class="strip"></span><span class="cnt">${list.length || ''}<small>${fmtTotalShort(dayTotal(start))}</small></span></button>` +
        `<div class="detail">${list.map(t => `<span><em>${fmtTime(t)}</em>${dur[t] ? Math.max(1, Math.round(dur[t] / 60)) + ' min' : (a && a.start === t ? 'i gang' : '')}</span>`).join('') || 'Ingen registreringer'}</div>`;
      drawStrip(li.querySelector('.strip'), start);
      li.querySelector('.row').addEventListener('click', () => li.classList.toggle('open'));
      els.days.appendChild(li);
    });
  }

  function openLog() {
    renderLog();
    els.sheet.classList.add('open');
    els.sheet.setAttribute('aria-hidden', 'false');
    els.sheet.scrollTop = 0;
  }
  function closeLog() {
    els.sheet.classList.remove('open');
    els.sheet.setAttribute('aria-hidden', 'true');
  }
  $('logBtn').addEventListener('click', openLog);
  $('dayBtn').addEventListener('click', openLog);
  $('closeLog').addEventListener('click', closeLog);
  els.seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    logDays = +b.dataset.days;
    [...els.seg.children].forEach(x => x.classList.toggle('on', x === b));
    renderLog();
  });
  const active = () => {
    const a = store.get(ACTIVE, null);
    if (a && Date.now() - a.start > MAX_SESSION) { store.set(ACTIVE, null); return null; }
    return a;
  };

  // Lyd: syntetiserede klokker i Web Audio (ingen lydfiler).
  // Hver tone er en lille klokke med uharmoniske overtoner, der klinger ud hver for sig,
  // et blødt anslag og en kort, varm rumklang. Alt går gennem en kompressor, så intet skærer.
  const Sound = (() => {
    const N = { D4: 293.66, A4: 440, D5: 587.33, E5: 659.25, Fs5: 739.99, A5: 880, B5: 987.77, D6: 1174.66 };
    // [frekvensforhold, styrke, efterklang i forhold til grundtonen]
    const PARTIALS = [[1, 1, 1], [2.0, .3, .62], [2.76, .14, .42], [4.07, .06, .3], [5.43, .035, .2]];

    function impulse(ctx, seconds, decay) {
      const rate = ctx.sampleRate, len = Math.floor(rate * seconds), pre = Math.floor(rate * .015);
      const buf = ctx.createBuffer(2, len, rate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch); let lp = 0;
        for (let i = pre; i < len; i++) {
          const k = (i - pre) / (len - pre);
          const damp = .25 + .7 * k;                     // højtonerne dør hurtigere ud: varmere hale
          lp += (Math.random() * 2 - 1 - lp) * (1 - damp);
          d[i] = lp * Math.pow(1 - k, decay);
        }
      }
      return buf;
    }

    function engine(ctx) {
      const input = ctx.createGain();
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6500; lp.Q.value = .4;
      const dry = ctx.createGain(); dry.gain.value = .85;
      const verb = ctx.createConvolver(); verb.buffer = impulse(ctx, 3.2, 2.8);
      const wet = ctx.createGain(); wet.gain.value = .3;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 3.5; comp.attack.value = .004; comp.release.value = .3;
      const out = ctx.createGain(); out.gain.value = 1.5;
      input.connect(hp).connect(lp);
      lp.connect(dry).connect(comp);
      lp.connect(verb).connect(wet).connect(comp);
      comp.connect(out).connect(ctx.destination);
      return { ctx, input };
    }

    // Én klokketone. vel 0–1, len = efterklang i sekunder, pan -1..1
    function bell(e, t, f, vel = .6, len = 3, pan = 0) {
      const { ctx } = e;
      const v = ctx.createGain(); v.gain.value = vel * .22;
      const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (p) { p.pan.value = pan; v.connect(p).connect(e.input); } else v.connect(e.input);
      PARTIALS.forEach(([r, a, d], i) => {
        const detunes = i === 0 ? [-2.5, 2.5] : [0];      // svag svævning i grundtonen giver liv
        detunes.forEach(c => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = f * r; o.detune.value = c;
          const amp = a * (i === 0 ? .55 : 1) * (1 - .35 * (1 - vel) * Math.min(i, 3) / 3);
          const atk = i === 0 ? .008 : .003;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(amp, t + atk);
          g.gain.exponentialRampToValueAtTime(.0001, t + len * d);
          o.connect(g).connect(v); o.start(t); o.stop(t + len * d + .05);
        });
      });
      // Blødt anslag: et kort pust af filtreret støj, som en filtkølle
      const nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * .04), ctx.sampleRate);
      const nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nd.length) ** 3;
      const ns = ctx.createBufferSource(); ns.buffer = nb;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 2; bp.Q.value = 1.2;
      const ng = ctx.createGain(); ng.gain.value = .18 * vel;
      ns.connect(bp).connect(ng).connect(v); ns.start(t);
    }

    // Syngeskål: lav tone der svulmer op og svæver langsomt, til sikkerhedslyden
    function bowl(e, t, f, vel = .6, len = 5) {
      const { ctx } = e;
      const v = ctx.createGain(); v.connect(e.input);
      v.gain.setValueAtTime(0, t);
      v.gain.linearRampToValueAtTime(vel * .16, t + .35);
      v.gain.exponentialRampToValueAtTime(.0001, t + len);
      [[1, 1, 0], [1, .8, .9], [2.71, .18, 0], [5.2, .05, 0]].forEach(([r, a, beat]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f * r + beat; g.gain.value = a;
        o.connect(g).connect(v); o.start(t); o.stop(t + len + .05);
      });
    }

    const patterns = {
      // 10 min: to toner, en kvint op. Som et let skulderklap.
      10: (e, t) => { bell(e, t, N.D5, .5, 3.2, -.15); bell(e, t + .32, N.A5, .42, 3.6, .15); },
      // 15 min: en åben dur-brydning med en svag top. Rolig og varm.
      15: (e, t) => {
        bell(e, t, N.D5, .5, 3.2, -.2); bell(e, t + .26, N.Fs5, .44, 3.2, 0);
        bell(e, t + .52, N.A5, .44, 3.6, .2); bell(e, t + .86, N.D6, .26, 4, .1);
      },
      // 25 min: syngeskål under et tydeligt, men venligt klokkemotiv, spillet to gange.
      25: (e, t) => {
        bowl(e, t, N.D4, .9, 6);
        [0, 1.5].forEach((o, k) => {
          const v = k ? 1 : .85;
          bell(e, t + o, N.A5, v, 2.6, -.25); bell(e, t + o + .2, N.Fs5, v * .9, 2.6, .25);
          bell(e, t + o + .4, N.A5, v, 2.6, -.1); bell(e, t + o + .62, N.D6, v * .95, 3.4, .15);
        });
      }
    };
    return { engine, patterns };
  })();
  window.BoobieSound = Sound; // til test

  // Afspilning: lydene renderes én gang til små WAV-filer og spilles gennem et <audio>-element.
  // Lydfiler i et medieelement spiller på iPhone, også når lydløs-knappen er slået til.
  // Web Audio bruges kun som reserve.
  const player = $('player');
  const clips = {};
  let unlocked = false, ctx = null, eng = null;

  function toWav(b) {
    const ch = b.numberOfChannels, len = b.length, sr = b.sampleRate;
    const buf = new ArrayBuffer(44 + len * ch * 2), v = new DataView(buf);
    const w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + len * ch * 2, true); w(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, len * ch * 2, true);
    const data = [...Array(ch)].map((_, i) => b.getChannelData(i));
    for (let i = 0, o = 44; i < len; i++) for (let c = 0; c < ch; c++, o += 2) v.setInt16(o, Math.max(-1, Math.min(1, data[c][i])) * 32767, true);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  async function renderClips() {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return;
    for (const [name, secs] of [[10, 5], [15, 6], [25, 8]]) {
      try {
        const oc = new OAC(2, 44100 * secs, 44100);
        Sound.patterns[name](Sound.engine(oc), .05);
        clips[name] = toWav(await oc.startRendering());
      } catch {}
    }
    const oc = new OAC(1, 4410, 44100);   // 0,1 s stilhed til at låse afspilleren op
    clips.silence = toWav(await oc.startRendering());
  }
  renderClips();

  function unlockAudio() {
    try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch {}
    if (!unlocked && clips.silence) {
      player.src = clips.silence;
      player.play().then(() => { unlocked = true; }).catch(() => {});
    }
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      eng = eng || Sound.engine(ctx);
    } catch {}
  }
  function play(name) {
    if (clips[name]) {
      player.src = clips[name];
      player.currentTime = 0;
      player.play().catch(() => playWebAudio(name));
    } else playWebAudio(name);
  }
  function playWebAudio(name) {
    if (!ctx || !eng) return;
    ctx.resume().then(() => Sound.patterns[name](eng, ctx.currentTime + .06)).catch(() => {});
  }

  // Haptik: Android har vibrate(). iPhone (iOS 18+) giver et lille tryk, når en skjult kontakt slås om.
  const hapticLabel = $('haptic');
  function haptic(pattern) {
    if (navigator.vibrate) { navigator.vibrate(pattern); return; }
    let t = 0;
    pattern.forEach((ms, i) => {
      if (i % 2 === 0) for (let k = 0; k < Math.max(1, Math.round(ms / 60)); k++) setTimeout(() => hapticLabel.click(), t + k * 60);
      t += ms;
    });
  }
  const sounds = {
    10: () => { play(10); haptic([60, 260, 60]); },
    15: () => { play(15); haptic([60, 200, 60, 200, 60]); },
    25: () => { play(25); haptic([300, 150, 300, 150, 300, 400, 300, 150, 300, 150, 300]); }
  };

  // Hold skærmen tændt mens der ammes, så lydene kan nå at spille
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
      if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch {}
  }

  const R = 108;
  [10, 15].forEach(m => {
    const a = (m / FULL) * 2 * Math.PI;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('class', 'tick'); c.dataset.m = m;
    c.setAttribute('cx', 110 + R * Math.cos(a)); c.setAttribute('cy', 110 + R * Math.sin(a)); c.setAttribute('r', 2.2);
    els.ticks.appendChild(c);
  });

  let alarmTimer = null;
  function startAlarm() {
    stopAlarm();
    document.body.classList.add('alarm');
    els.sub.textContent = 'Er du vågen? Tryk et sted for at fortsætte';
    sounds[25]();
    let n = 0;
    alarmTimer = setInterval(() => { if (++n > 6) return stopAlarm(true); sounds[25](); }, 20000);
  }
  function stopAlarm(keepText) {
    clearInterval(alarmTimer); alarmTimer = null;
    document.body.classList.remove('alarm');
    if (!keepText) els.sub.textContent = 'Tryk igen for at stoppe';
  }
  document.addEventListener('pointerdown', e => {
    unlockAudio(); // også når appen genåbnes midt i en amning
    if (document.body.classList.contains('alarm') && !els.press.contains(e.target)) stopAlarm();
  });

  const fmtClock = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  function tick() {
    const a = active();
    document.body.classList.toggle('timing', !!a);
    if (!a) { els.arc.style.strokeDasharray = '0 1'; renderSince(); drawStrip(els.strip, midnight()); return; }
    drawStrip(els.strip, midnight());
    renderTotal();
    const ms = Date.now() - a.start, min = ms / 60000;
    els.clock.textContent = fmtClock(ms);
    const f = Math.min(1, min / FULL);
    els.arc.style.strokeDasharray = `${f} 1`;
    [...els.ticks.children].forEach(c => c.classList.toggle('done', min >= +c.dataset.m));
    for (const m of MILESTONES) {
      if (min >= m && !a.fired.includes(m)) {
        a.fired.push(m); store.set(ACTIVE, a);
        if (m === 25) startAlarm(); else { sounds[m](); pulse(); }
      }
    }
  }
  setInterval(tick, 1000);

  function pulse() { els.press.classList.remove('pulse'); void els.press.offsetWidth; els.press.classList.add('pulse'); }

  function stopTimer() {
    const a = active();
    if (!a) return;
    const d = durations();
    d[a.start] = Math.round((Date.now() - a.start) / 1000);
    const cutoff = Date.now() - KEEP_DAYS * 864e5;
    Object.keys(d).forEach(k => { if (+k < cutoff) delete d[k]; });
    store.set(DUR, d);
    store.set(ACTIVE, null);
    stopAlarm();
    keepAwake(false);
  }

  let lastTap = 0;
  els.press.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 800) return; // undgå utilsigtede dobbelttryk
    lastTap = now;
    unlockAudio();
    haptic([30]);

    if (active()) {          // anden tryk: stop tidtagning
      stopTimer();
      tick(); render();
      return;
    }

    const data = all().filter(t => t >= now - KEEP_DAYS * 864e5);
    data.push(now);
    store.set(KEY, data);
    store.set(ACTIVE, { start: now, fired: [] });
    keepAwake(true);

    pulse();
    tick();
    render({ animate: true });

    if (today().length === GOAL && store.get(CEL, '') !== dayKey()) {
      store.set(CEL, dayKey());
      setTimeout(celebrate, 600);
    }
  });

  els.undo.addEventListener('click', () => {
    const list = today();
    if (!list.length) return;
    const last = list[list.length - 1];
    const a = active();
    if (a && a.start === last) { store.set(ACTIVE, null); stopAlarm(); keepAwake(false); }
    const data = all();
    data.splice(data.lastIndexOf(last), 1);
    store.set(KEY, data);
    const d = durations(); delete d[last]; store.set(DUR, d);
    tick(); render();
  });

  function celebrate() {
    const styles = getComputedStyle(document.documentElement);
    const colors = ['--areola', '--skin', '--sage', '--sand-deep'].map(v => styles.getPropertyValue(v).trim());
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const pieces = reduce ? 0 : 34;
    for (let i = 0; i < pieces; i++) {
      const p = document.createElement('span');
      p.className = 'p ' + (Math.random() < .55 ? 'leaf' : 'dot');
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--drift', ((Math.random() - .5) * 120).toFixed(0) + 'px');
      p.style.setProperty('--spin', ((Math.random() - .5) * 540).toFixed(0) + 'deg');
      p.style.animationDuration = (7 + Math.random() * 5).toFixed(2) + 's';
      p.style.animationDelay = (Math.random() * 3.5).toFixed(2) + 's';
      p.addEventListener('animationend', () => p.remove());
      els.cel.appendChild(p);
    }
    els.msg.classList.add('show');
    setTimeout(() => els.msg.classList.remove('show'), 6500);
  }

  // Nulstil ved midnat og når appen åbnes igen
  function checkDay() {
    const k = dayKey();
    if (k !== currentDay) { currentDay = k; render(); }
  }
  setInterval(checkDay, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkDay(); render(); } });

  // Genåbnet midt i en amning: spring milepæle over, der allerede er passeret
  (() => {
    const a = active();
    if (!a) return;
    const min = (Date.now() - a.start) / 60000;
    a.fired = MILESTONES.filter(m => min >= m);
    store.set(ACTIVE, a);
    keepAwake(true);
  })();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && active()) keepAwake(true); });

  tick();
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
